<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#74ebd5,#9face6);
    }

    .container{
      width:380px;
      background:white;
      padding:25px;
      border-radius:20px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
      text-align:center;
    }

    h1{
      margin-bottom:20px;
      color:#333;
    }

    .search-box{
      display:flex;
      gap:10px;
      margin-bottom:10px;
    }

    input{
      flex:1;
      padding:12px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:16px;
      outline:none;
    }

    button{
      padding:12px 15px;
      border:none;
      background:#4f46e5;
      color:white;
      border-radius:10px;
      cursor:pointer;
    }

    button:hover{
      background:#3730a3;
    }

    .suggestions{
      text-align:left;
      background:white;
      border-radius:10px;
      overflow:hidden;
      margin-bottom:10px;
      box-shadow:0 3px 10px rgba(0,0,0,0.1);
    }

    .suggestion-item{
      padding:10px;
      cursor:pointer;
      border-bottom:1px solid #eee;
    }

    .suggestion-item:hover{
      background:#f1f5f9;
    }

    .weather{
      display:none;
      margin-top:15px;
    }

    .weather img{
      width:100px;
    }

    .temp{
      font-size:45px;
      font-weight:bold;
      color:#222;
    }

    .city{
      font-size:25px;
      margin:5px 0;
    }

    .condition{
      color:#666;
      margin-bottom:15px;
    }

    .details{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:15px;
    }

    .box{
      background:#f1f5f9;
      padding:12px;
      border-radius:12px;
    }

    .box p:first-child{
      font-weight:bold;
      margin-bottom:5px;
    }

    .error{
      color:red;
      margin-top:10px;
      display:none;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>Weather App 🌦️</h1>

    <div class="search-box">
      <input 
        type="text" 
        id="cityInput" 
        placeholder="Enter city"
        autocomplete="off"
      >

      <button onclick="getWeather()">
        Search
      </button>
    </div>

    <div id="suggestions" class="suggestions"></div>

    <p id="error" class="error"></p>

    <div class="weather" id="weather">

      <img id="icon" src="" alt="icon">

      <div class="temp" id="temp"></div>

      <div class="city" id="city"></div>

      <div class="condition" id="condition"></div>

      <div class="details">

        <div class="box">
          <p>Humidity</p>
          <p id="humidity"></p>
        </div>

        <div class="box">
          <p>Wind</p>
          <p id="wind"></p>
        </div>

        <div class="box">
          <p>AQI</p>
          <p id="aqi"></p>
        </div>

        <div class="box">
          <p>Feels Like</p>
          <p id="feels"></p>
        </div>

      </div>

    </div>

  </div>

  <script>

    const apiKey = "b44826aefd05453f99f22418262405";

    async function getWeather(cityName = ""){

      const city =
        cityName ||
        document.getElementById("cityInput").value.trim();

      const weather =
        document.getElementById("weather");

      const error =
        document.getElementById("error");

      if(city === ""){
        error.style.display = "block";
        error.innerText = "Please enter city name";
        weather.style.display = "none";
        return;
      }

      try{

        const response = await fetch(
          `https://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${city}&aqi=yes`
        );

        const data = await response.json();

        console.log(data);

        if(data.error){
          error.style.display = "block";
          error.innerText = data.error.message;
          weather.style.display = "none";
          return;
        }

        document.getElementById("icon").src =
          "https:" + data.current.condition.icon;

        document.getElementById("temp").innerText =
          data.current.temp_c + "°C";

        document.getElementById("city").innerText =
          data.location.name + ", " + data.location.country;

        document.getElementById("condition").innerText =
          data.current.condition.text;

        document.getElementById("humidity").innerText =
          data.current.humidity + "%";

        document.getElementById("wind").innerText =
          data.current.wind_kph + " km/h";

        document.getElementById("aqi").innerText =
          Math.round(data.current.air_quality.pm2_5);

        document.getElementById("feels").innerText =
          data.current.feelslike_c + "°C";

        weather.style.display = "block";
        error.style.display = "none";

      }
      catch(err){

        console.log(err);

        error.style.display = "block";
        error.innerText = "Something went wrong";

        weather.style.display = "none";
      }

    }

    let timeout;

    document.getElementById("cityInput")
      .addEventListener("keyup", () => {

      clearTimeout(timeout);

      timeout = setTimeout(async () => {

        const input =
          document.getElementById("cityInput")
          .value
          .trim();

        const suggestions =
          document.getElementById("suggestions");

        suggestions.innerHTML = "";

        if(input.length < 2){
          return;
        }

        try{

          const response = await fetch(
            `https://api.weatherapi.com/v1/search.json?key=${apiKey}&q=${input}`
          );

          const data = await response.json();

          data.forEach(city => {

            const div =
              document.createElement("div");

            div.classList.add("suggestion-item");

            div.innerText =
              `${city.name}, ${city.country}`;

            div.onclick = () => {

              document.getElementById("cityInput")
                .value = city.name;

              suggestions.innerHTML = "";

              getWeather(city.name);
            };

            suggestions.appendChild(div);

          });

        }
        catch(err){
          console.log(err);
        }

      },300);

    });

    getWeather("London");

  </script>

</body>
</html>
